# Local development stack. Not a production topology — no replicas, no secrets
# manager, no TLS termination.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safaritiketi
      POSTGRES_USER: safaritiketi
      POSTGRES_PASSWORD: local-development-only
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safaritiketi -d safaritiketi"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., dockerfile: services/api/Dockerfile }
    command: ["node", "services/api/src/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://safaritiketi:local-development-only@db:5432/safaritiketi
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: services/api/Dockerfile }
    ports: ["8080:8080"]
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://safaritiketi:local-development-only@db:5432/safaritiketi
      # Development values. Production reads these from a secrets manager.
      SIGNING_KEYS: "K2:ACTIVE:local-development-signing-secret-value-01,K1:VERIFY_ONLY:local-development-signing-secret-value-00"
      PII_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      GATE_PROVISIONING_TOKEN: "local-development-gate-provisioning-token"
      LOG_LEVEL: debug
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
